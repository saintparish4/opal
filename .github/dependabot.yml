version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    # The oxc crates share one version and only build together, and a new
    # parser can read the same source differently, which is a
    # MEMO_FORMAT_VERSION question. They are bumped by hand, as a task.
    # This stops version updates only; a security advisory still opens a
    # pull request.
    ignore:
      - dependency-name: "oxc_*"
    groups:
      # Patch only: Dependabot calls 0.11 -> 0.12 a minor update, and for a
      # 0.x crate that one is breaking.
      patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]