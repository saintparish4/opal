name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is out of scope for v1 (PRD §5) — no windows-latest job.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain, channel, and components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — `rustup show` installs whatever it declares
      # rather than duplicating that config here.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so `fixtures` is on explicitly. Both integration suites
      # need it, and today it is enabled implicitly by the dev-dependencies —
      # a manifest edit could drop the module out of the build without a
      # single test disappearing from the report.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --verbose

      - name: Build
        run: cargo build --workspace --verbose

  # `testing_strategy.md` §5 requires these gated separately: an install
  # failure is a registry/resolution bug and a run failure is a
  # runtime/resolver bug, and conflating them into one red check hides which
  # of the two happened. Both reach the public registry, which is why they are
  # `#[ignore]` in the ordinary suite and run explicitly here.
  compatibility-install:
    name: npm compatibility (install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_install

  compatibility-execute:
    name: npm compatibility (execute)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # The installed tree has to run, not merely exist, so this job needs a
      # Node to run it with.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_execute

  # `testing_strategy.md` §1: resolve the same package.json with npm and with
  # opal, and fail if they pick different versions for the project's own
  # dependencies or read any range differently. The property tests only hold
  # opal to its own semver; this holds it to npm's.
  npm-cross-check:
    name: npm cross-check (resolution)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cross-check
        run: cargo test -p opal-pm --test npm-cross-check -- --ignored --nocapture

  # `testing_strategy.md` §7: record every run's numbers, never gate on them.
  # No noise threshold has been agreed, so nothing here can fail the build on a
  # measurement, and `continue-on-error` keeps a broken harness from blocking
  # a merge. Each run's numbers go to the job summary, and as JSON to an
  # artifact, one record per simulated latency.
  benchmark:
    name: Install benchmark (tracked, not gated)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run
        run: |
          set -euo pipefail
          mkdir -p bench
          for rtt in 0 25; do
            cargo bench -p opal-pm --bench install-pipeline -- --json --rtt-ms "$rtt" > "bench/rtt-${rtt}ms.json"
          done
      - name: Summarize
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json

          print("### Install benchmark (tracked, not gated)\n")
          print("| RTT | Scenario | Median | Min | Max | Round trips |")
          print("|---|---|---|---|---|---|")
          for path in sorted(glob.glob("bench/*.json"), key=lambda p: json.load(open(p))["rtt_ms"]):
              record = json.load(open(path))
              for scenario in record["scenarios"]:
                  wall = scenario["wall_ms"]
                  trips = scenario["packument_round_trips"] + scenario["tarball_round_trips"]
                  print(
                      f"| {record['rtt_ms']:g} ms | {scenario['scenario']} | {wall['median']:.1f} ms "
                      f"| {wall['min']:.1f} ms | {wall['max']:.1f} ms | {trips} |"
                  )
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: install-benchmark
          path: bench/*.json
