name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is out of scope for v1 (PRD §5) — no windows-latest job.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Toolchain, channel, and components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — `rustup show` installs whatever it declares
      # rather than duplicating that config here.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so `fixtures` is on explicitly. Both integration suites
      # need it, and today it is enabled implicitly by the dev-dependencies —
      # a manifest edit could drop the module out of the build without a
      # single test disappearing from the report.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --verbose

      - name: Build
        run: cargo build --workspace --verbose

  # `testing_strategy.md` §5 requires these gated separately: an install
  # failure is a registry/resolution bug and a run failure is a
  # runtime/resolver bug, and conflating them into one red check hides which
  # of the two happened. Both reach the public registry, which is why they are
  # `#[ignore]` in the ordinary suite and run explicitly here.
  compatibility-install:
    name: npm compatibility (install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_install

  compatibility-execute:
    name: npm compatibility (execute)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # The installed tree has to run, not merely exist, so this job needs a
      # Node to run it with.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Execute
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_execute

  # `testing_strategy.md` §1: resolve the same package.json with npm and with
  # opal, and fail if the trees differ or either reads a range differently.
  # It also holds opal's version preference to `npm-pick-manifest` itself.
  # The property tests only hold opal to its own semver; this holds it to npm's.
  npm-cross-check:
    name: npm cross-check (resolution)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Cross-check
        run: cargo test -p opal-pm --test npm-cross-check -- --ignored --nocapture

  # crates/opal-bundler/SEMANTICS.md: every fixture is run unbundled and
  # bundled under Node, and the two runs must be indistinguishable. Node is
  # the oracle, so the job pins the major version the contract names.
  bundler-differential:
    name: Bundler differential (Node oracle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the tools fixtures compare against
        run: npm ci --prefix crates/opal-bundler/tools
      - name: Differential
        run: cargo test -p opal-bundler --test differential -- --ignored --nocapture
      - name: CommonJS lexer against Node's
        run: cargo test -p opal-bundler --test cjs-lexer -- --ignored --nocapture
      - name: Generated module graphs
        run: cargo test -p opal-bundler --test generated -- --ignored --nocapture

  # crates/opal-bundler/test262: every module test of test262 run as written
  # and bundled. The run fails on a failure without an annotation.
  bundler-test262:
    name: Bundler test262
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build opal
        run: cargo build -p opal-cli
      - name: test262
        run: python3 crates/opal-bundler/test262/run.py --opal target/debug/opal

  # SEMANTICS.md rule 16: a bundle is a function of the graph, the options,
  # and the opal version. Each OS bundles every fixture from its own temp
  # path and publishes the checksums; the next job fails if they differ.
  bundler-checksums:
    name: Bundle checksums (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build opal
        run: cargo build -p opal-cli
      - name: Checksums
        run: python3 crates/opal-bundler/tests/checksums.py --opal target/debug/opal > bundle-checksums.txt
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: bundle-checksums-${{ matrix.os }}
          path: bundle-checksums.txt

  bundler-checksums-compare:
    name: Bundle checksums match across OSes
    needs: bundler-checksums
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-checksums-*
      - name: Compare
        run: |
          cat bundle-checksums-ubuntu-latest/bundle-checksums.txt
          diff bundle-checksums-ubuntu-latest/bundle-checksums.txt bundle-checksums-macos-latest/bundle-checksums.txt

  # `deny.toml`: licenses a static MIT binary can carry, crates.io as the only
  # source, and the crates the design rules out. Advisories are left to
  # audit.yml, so the result depends on the tree alone and can gate a merge.
  dependency-policy:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # Pinned for the same reason: a new cargo-deny release must not be able
      # to fail a pull request that didn't touch a dependency.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Check
        run: cargo deny --locked check bans licenses sources

  # `testing_strategy.md` §7: record every run's numbers, never gate on them.
  # No noise threshold has been agreed, so nothing here can fail the build on a
  # measurement, and `continue-on-error` keeps a broken harness from blocking
  # a merge. Each run's numbers go to the job summary, and as JSON to an
  # artifact, one record per run.
  #
  # The default workload's downloads are a round trip and no bytes, so it
  # only shows time spent waiting on round trips. The scaffold run has a real
  # tree's bytes and a bandwidth limit, which is what bounds a real cold
  # install; it is the one to read for download changes.
  benchmark:
    name: Install benchmark (tracked, not gated)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run
        run: |
          set -euo pipefail
          mkdir -p bench
          for rtt in 0 25; do
            cargo bench -p opal-pm --bench install-pipeline -- --json --rtt-ms "$rtt" > "bench/rtt-${rtt}ms.json"
          done
          cargo bench -p opal-pm --bench install-pipeline -- --json --workload scaffold \
            --rtt-ms 70 --bandwidth-mbit 37 --scenario cold --iterations 2 > bench/scaffold.json
      - name: Summarize
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json

          print("### Install benchmark (tracked, not gated)\n")
          print("| Workload | RTT | Bandwidth | Scenario | Median | Min | Max | Round trips | Transfer |")
          print("|---|---|---|---|---|---|---|---|---|")
          records = [json.load(open(path)) for path in glob.glob("bench/*.json")]
          for record in sorted(records, key=lambda r: (r["workload"]["name"], r["rtt_ms"])):
              bandwidth = record["bandwidth_mbit"]
              for scenario in record["scenarios"]:
                  wall = scenario["wall_ms"]
                  trips = scenario["packument_round_trips"] + scenario["tarball_round_trips"]
                  print(
                      f"| {record['workload']['name']} | {record['rtt_ms']:g} ms "
                      f"| {f'{bandwidth} Mbit/s' if bandwidth else 'unlimited'} "
                      f"| {scenario['scenario']} | {wall['median']:.1f} ms "
                      f"| {wall['min']:.1f} ms | {wall['max']:.1f} ms | {trips} "
                      f"| {scenario['transfer_ms']:.0f} ms |"
                  )
          PY
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install-benchmark
          path: bench/*.json
