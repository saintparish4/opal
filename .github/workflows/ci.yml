name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Native Windows is out of scope for v1 (PRD §5) — no windows-latest job.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain, channel, and components (rustfmt, clippy) are pinned in
      # rust-toolchain.toml — `rustup show` installs whatever it declares
      # rather than duplicating that config here.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # --all-features so `fixtures` is on explicitly. Both integration suites
      # need it, and today it is enabled implicitly by the dev-dependencies —
      # a manifest edit could drop the module out of the build without a
      # single test disappearing from the report.
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --verbose

      - name: Build
        run: cargo build --workspace --verbose

  # `testing_strategy.md` §5 requires these gated separately: an install
  # failure is a registry/resolution bug and a run failure is a
  # runtime/resolver bug, and conflating them into one red check hides which
  # of the two happened. Both reach the public registry, which is why they are
  # `#[ignore]` in the ordinary suite and run explicitly here.
  compatibility-install:
    name: npm compatibility (install)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_install

  compatibility-execute:
    name: npm compatibility (execute)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      # The installed tree has to run, not merely exist, so this job needs a
      # Node to run it with.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Execute
        run: cargo test -p opal-cli --test npm-compatibility -- --ignored test_execute
