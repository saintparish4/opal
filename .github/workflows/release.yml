name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: opal

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - asset: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            linker_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - asset: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain, channel, and components are pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      # ubuntu-latest is x86_64; aarch64-unknown-linux-gnu needs a cross
      # linker. macos-latest is an Apple Silicon runner and can cross-link
      # x86_64-apple-darwin directly via Xcode's toolchain, no extra package.
      - name: Install cross linker
        if: matrix.linker_package
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker_package }}

      - name: Configure cross linker
        if: matrix.linker
        run: |
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p opal-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp LICENSE "$stage/"
          archive="${BIN_NAME}-${{ matrix.asset }}.tar.gz"
          tar -C "$stage" -czf "$archive" "${BIN_NAME}" LICENSE
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.asset }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS across all four artifacts from this one matrix run —
      # never a partial release, and never checksums assembled by hand.
      - name: Build combined checksum file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
