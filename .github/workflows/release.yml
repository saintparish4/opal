name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: builds, packages, and checksums all four targets from any
  # branch and publishes nothing. A pushed tag can't be moved, so a build that
  # breaks only here costs a version number unless it is found first.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: opal
  # The newest glibc a Linux binary may require; the README's Install section
  # states the same number.
  MAX_GLIBC: "2.34"

# The build jobs run every dependency's build script, so their token can't
# write to the repository. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux targets pin ubuntu-22.04, never ubuntu-latest: a binary
          # can require the newest symbols of the glibc it was linked against.
          # v0.3.1 was built on 24.04, needed glibc 2.39, and wouldn't start
          # on Ubuntu 22.04, Debian 12, or RHEL 9.
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            linker_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - asset: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By default the token stays in .git/config for the rest of the job,
          # where a build script could read it.
          persist-credentials: false

      # Toolchain, channel, and components are pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      # The Linux runner is x86_64; aarch64-unknown-linux-gnu needs a cross
      # linker. macos-latest is an Apple Silicon runner and can cross-link
      # x86_64-apple-darwin directly via Xcode's toolchain, no extra package.
      - name: Install cross linker
        if: matrix.linker_package
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker_package }}

      - name: Configure cross linker
        if: matrix.linker
        run: |
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # No cargo cache, unlike CI: a release binary is compiled from source and
      # from the committed lockfile, never on top of an earlier run's target
      # directory. A clean build takes about a minute per target.
      - name: Build
        run: cargo build --release --locked -p opal-cli --target ${{ matrix.target }}

      # Nothing else notices when the requirement rises: the build passes and
      # the binary runs on the runner. readelf, not objdump, because it reads
      # the cross-compiled arm64 binary too.
      - name: Check the glibc requirement
        if: startsWith(matrix.asset, 'linux-')
        run: |
          set -euo pipefail
          needed="$(readelf -V "target/${{ matrix.target }}/release/${BIN_NAME}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "requires ${needed}; the limit is GLIBC_${MAX_GLIBC}"
          [ "$(printf '%s\n' "$needed" "GLIBC_${MAX_GLIBC}" | sort -V | tail -1)" = "GLIBC_${MAX_GLIBC}" ]

      - name: Package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp LICENSE "$stage/"
          archive="${BIN_NAME}-${{ matrix.asset }}.tar.gz"
          tar -C "$stage" -czf "$archive" "${BIN_NAME}" LICENSE
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.asset }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS across all four artifacts from this one matrix run —
      # never a partial release, and never checksums assembled by hand.
      - name: Build combined checksum file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      # The archives crossed from the build jobs to this one as artifacts.
      # This is the check install.sh makes, run before anyone can download.
      - name: Verify checksums
        run: cd dist && sha256sum --check --strict SHA256SUMS

      # gh rather than an action, so nothing third-party runs with the write
      # token. It uploads to a draft and publishes last, so a release is never
      # visible with files missing, and it refuses a tag that already has a
      # release rather than replacing that release's files.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
