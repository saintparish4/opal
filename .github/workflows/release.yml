name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: opal
  # The newest glibc a Linux binary may require; the README's Install section
  # states the same number.
  MAX_GLIBC: "2.34"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux targets pin ubuntu-22.04, never ubuntu-latest: a binary
          # can require the newest symbols of the glibc it was linked against.
          # v0.3.1 was built on 24.04, needed glibc 2.39, and wouldn't start
          # on Ubuntu 22.04, Debian 12, or RHEL 9.
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - asset: linux-arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            linker_package: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - asset: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Toolchain, channel, and components are pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      # The Linux runner is x86_64; aarch64-unknown-linux-gnu needs a cross
      # linker. macos-latest is an Apple Silicon runner and can cross-link
      # x86_64-apple-darwin directly via Xcode's toolchain, no extra package.
      - name: Install cross linker
        if: matrix.linker_package
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.linker_package }}

      - name: Configure cross linker
        if: matrix.linker
        run: |
          echo "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release -p opal-cli --target ${{ matrix.target }}

      # Nothing else notices when the requirement rises: the build passes and
      # the binary runs on the runner. readelf, not objdump, because it reads
      # the cross-compiled arm64 binary too.
      - name: Check the glibc requirement
        if: startsWith(matrix.asset, 'linux-')
        run: |
          set -euo pipefail
          needed="$(readelf -V "target/${{ matrix.target }}/release/${BIN_NAME}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "requires ${needed}; the limit is GLIBC_${MAX_GLIBC}"
          [ "$(printf '%s\n' "$needed" "GLIBC_${MAX_GLIBC}" | sort -V | tail -1)" = "GLIBC_${MAX_GLIBC}" ]

      - name: Package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp LICENSE "$stage/"
          archive="${BIN_NAME}-${{ matrix.asset }}.tar.gz"
          tar -C "$stage" -czf "$archive" "${BIN_NAME}" LICENSE
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.asset }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One SHA256SUMS across all four artifacts from this one matrix run —
      # never a partial release, and never checksums assembled by hand.
      - name: Build combined checksum file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
