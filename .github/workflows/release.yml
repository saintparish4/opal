name: Release

on:
  push:
    tags:
      - "v*"
  # A dry run: builds, packages, and checksums all four targets from any
  # branch and publishes nothing. A pushed tag can't be moved, so a build that
  # breaks only here costs a version number unless it is found first.
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose CHANGELOG.md section to extract (default: the version in Cargo.toml)"
        required: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: opal
  # The newest glibc a Linux binary may require; the README's Install section
  # states the same number.
  MAX_GLIBC: "2.34"

# The build jobs run every dependency's build script, so their token can't
# write to the repository. Only the publish job asks for more.
permissions:
  contents: read

jobs:
  # The release body is the changelog's section for the version, so the notes
  # and the changelog can't say different things. `--generate-notes` gave
  # v0.3.1 and v0.4.0 a changelog link and two Dependabot lines. First, so a
  # tag with no section fails before four targets are built for nothing.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            Cargo.toml
          sparse-checkout-cone-mode: false

      # A tag must name the version the binaries were built as, or
      # `opal --version` reports a different release than the one it came
      # from, and the tag can't be moved to fix it.
      - name: Extract the changelog section
        env:
          REQUESTED: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              built = tomllib.load(manifest)["workspace"]["package"]["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if version != built:
                  sys.exit(f"tag {os.environ['GITHUB_REF_NAME']} names {version}, Cargo.toml builds {built}")
              ref = os.environ["GITHUB_REF_NAME"]
          else:
              version = os.environ["REQUESTED"] or built
              ref = os.environ["GITHUB_SHA"]

          section, found = [], False
          for line in open("CHANGELOG.md", encoding="utf-8"):
              if line.startswith("## "):
                  if found:
                      break
                  found = re.match(rf"## \[{re.escape(version)}\](\s|$)", line) is not None
              elif found:
                  section.append(line)
          body = "".join(section).strip()
          if not body:
              sys.exit(f"CHANGELOG.md has no section for {version}: add `## [{version}] (date)` before tagging")

          # A link relative to the repository resolves against the release
          # page on GitHub, not the file, so it is pinned to this ref instead.
          body = body.replace("](./", f"](https://github.com/{os.environ['REPOSITORY']}/blob/{ref}/")
          with open("notes.md", "w", encoding="utf-8") as notes:
              notes.write(body + "\n")
          print(f"Release notes for {version}:\n\n{body}")
          PY
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.asset }})
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux targets pin ubuntu-22.04, never ubuntu-latest: a binary
          # can require the newest symbols of the glibc it was linked against.
          # v0.3.1 was built on 24.04, needed glibc 2.39, and wouldn't start
          # on Ubuntu 22.04, Debian 12, or RHEL 9.
          - asset: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          #
          # Every target builds on a machine of its own architecture: the
          # runtime's V8 startup snapshot is made by running V8 for the
          # target during the build, so it can't be cross-compiled
          # (crates/opal-runtime/build.rs refuses).
          - asset: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - asset: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - asset: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By default the token stays in .git/config for the rest of the job,
          # where a build script could read it.
          persist-credentials: false

      # Toolchain, channel, and components are pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      # No cargo cache, unlike CI: a release binary is compiled from source and
      # from the committed lockfile, never on top of an earlier run's target
      # directory. A clean build takes about a minute per target.
      - name: Build
        run: cargo build --release --locked -p opal-cli --target ${{ matrix.target }}

      # Nothing else notices when the requirement rises: the build passes and
      # the binary runs on the runner.
      - name: Check the glibc requirement
        if: startsWith(matrix.asset, 'linux-')
        run: |
          set -euo pipefail
          needed="$(readelf -V "target/${{ matrix.target }}/release/${BIN_NAME}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "requires ${needed}; the limit is GLIBC_${MAX_GLIBC}"
          [ "$(printf '%s\n' "$needed" "GLIBC_${MAX_GLIBC}" | sort -V | tail -1)" = "GLIBC_${MAX_GLIBC}" ]

      # Owned by root, not by the runner's uid 1001: `install.sh` run as root,
      # as in a Dockerfile, keeps an archive's owner on the files it unpacks.
      # GNU tar and the macOS runners' bsdtar spell the options differently.
      - name: Package
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          cp LICENSE "$stage/"
          archive="${BIN_NAME}-${{ matrix.asset }}.tar.gz"
          if tar --version | grep -q 'GNU tar'; then
            owner=(--owner=0 --group=0 --numeric-owner)
          else
            owner=(--uid 0 --gid 0 --numeric-owner)
          fi
          tar "${owner[@]}" -C "$stage" -czf "$archive" "${BIN_NAME}" LICENSE
          python3 - "$archive" <<'PY'
          import sys
          import tarfile

          wrong = [f"{m.name} ({m.uid}:{m.gid})" for m in tarfile.open(sys.argv[1]) if m.uid or m.gid]
          if wrong:
              sys.exit(f"not owned by root: {', '.join(wrong)}")
          PY
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.asset }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [notes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.BIN_NAME }}-*
          path: dist
          merge-multiple: true

      - name: Download notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes

      # One SHA256SUMS across all four artifacts from this one matrix run —
      # never a partial release, and never checksums assembled by hand.
      - name: Build combined checksum file
        run: cat dist/*.sha256 > dist/SHA256SUMS

      # The archives crossed from the build jobs to this one as artifacts.
      # This is the check install.sh makes, run before anyone can download.
      - name: Verify checksums
        run: cd dist && sha256sum --check --strict SHA256SUMS

      # gh rather than an action, so nothing third-party runs with the write
      # token. It uploads to a draft and publishes last, so a release is never
      # visible with files missing, and it refuses a tag that already has a
      # release rather than replacing that release's files.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
