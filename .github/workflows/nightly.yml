name: Nightly

# Runs too long to sit on every push: they catch what a day of changes broke,
# and none of them is a required check. GitHub stops scheduling a public
# repository's workflows after 60 days with no activity, without failing
# anything, so the last run's date is kept in base/metrics.md where a stale
# one shows, and `workflow_dispatch` starts a run by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # `compat/COMPATIBILITY.md`: install each framework's own starter with a
  # release build of master, then build it, test it, and serve it. The table
  # committed for a release comes from that release's asset; this one is for
  # noticing the day something stops working.
  frameworks:
    name: Framework matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build
        run: cargo build --release --locked -p opal-cli
      - name: Run
        run: |
          set -o pipefail
          python3 compat/frameworks.py --opal target/release/opal --results results | tee frameworks.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Framework matrix"
            echo
            grep -E '^(Frameworks:|\|)' frameworks.log || echo "No table: the harness stopped before printing one."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frameworks
          path: results/*.json
          if-no-files-found: warn

  # `testing_strategy.md` §8 at scale: installs and adds killed at random
  # moments against the fixture registry, each re-run until it converges on
  # a clean install's tree. 12 trials per push; here, 1,000 each. The number
  # to quote is the kills that interrupted a running install, not trials.
  chaos:
    name: Random kills (1,000 trials)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPAL_CHAOS_TRIALS: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run
        run: |
          set -o pipefail
          cargo test --all-features -p opal-cli --test install-crash-safety -- --nocapture \
            kills_at_random_moments adds_killed_at_random_moments 2>&1 | tee chaos.log
      # Each line carries the seed, which replays the run with OPAL_CHAOS_SEED.
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Random kills"
            echo
            grep -oE 'OPAL_CHAOS_SEED=[0-9]+: [0-9]+ kills over .*' chaos.log | sed 's/^/- /' || echo "No count: the tests stopped before reporting one."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chaos
          path: chaos.log

  # Opal's own resolver invariants over generated registries, 250,000 cases
  # each instead of proptest's default 256. A release build with overflow
  # checks and debug assertions kept on: about three times the cases per
  # minute of a debug build, still panicking where a debug build would.
  resolver-properties:
    name: Resolver properties (250,000 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "250000"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run
        run: |
          set -o pipefail
          cargo test --release --all-features -p opal-pm --test resolution-properties 2>&1 | tee properties.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Resolver properties, ${PROPTEST_CASES} cases each"
            echo
            grep -E '^test result' properties.log || echo "No result: the suite stopped before reporting one."
          } >> "$GITHUB_STEP_SUMMARY"
      # A failing case is written to the regressions file. It becomes a named
      # regression test, so keep it rather than lose it with the runner.
      - name: Upload the failing case
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: resolution-properties-regressions
          path: |
            crates/opal-pm/tests/resolution-properties.proptest-regressions
            properties.log
