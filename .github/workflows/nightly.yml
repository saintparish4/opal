name: Nightly

# Runs too long to sit on every push: they catch what a day of changes broke,
# and none of them is a required check. GitHub stops scheduling a public
# repository's workflows after 60 days with no activity, without failing
# anything, so the last run's date is kept in base/metrics.md where a stale
# one shows, and `workflow_dispatch` starts a run by hand.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # `compat/COMPATIBILITY.md`: install each framework's own starter with a
  # release build of master, then build it, test it, and serve it. The table
  # committed for a release comes from that release's asset; this one is for
  # noticing the day something stops working.
  frameworks:
    name: Framework matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: V8's static library
        uses: ./.github/actions/rusty-v8
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        run: cargo build --release --locked -p opal-cli
      # The vite-react bundle's page load: Playwright and its Chromium.
      - name: Install the bundler's tools
        run: |
          npm ci --prefix crates/opal-bundler/tools
          cd crates/opal-bundler/tools && npx playwright install --with-deps chromium
      - name: Run
        run: |
          set -o pipefail
          python3 compat/frameworks.py --opal target/release/opal --results results | tee frameworks.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Framework matrix"
            echo
            grep -E '^(Frameworks:|\|)' frameworks.log || echo "No table: the harness stopped before printing one."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frameworks
          path: results/*.json
          if-no-files-found: warn

  # `testing_strategy.md` §8 at scale: installs and adds killed at random
  # moments against the fixture registry, each re-run until it converges on
  # a clean install's tree. 12 trials per push; here, 1,000 each. The number
  # to quote is the kills that interrupted a running install, not trials.
  chaos:
    name: Random kills (1,000 trials)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPAL_CHAOS_TRIALS: "1000"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: V8's static library
        uses: ./.github/actions/rusty-v8
      - name: Run
        run: |
          set -o pipefail
          cargo test --all-features -p opal-cli --test install-crash-safety -- --nocapture \
            kills_at_random_moments adds_killed_at_random_moments 2>&1 | tee chaos.log
      # Each line carries the seed, which replays the run with OPAL_CHAOS_SEED.
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Random kills"
            echo
            grep -oE 'OPAL_CHAOS_SEED=[0-9]+: [0-9]+ kills over .*' chaos.log | sed 's/^/- /' || echo "No count: the tests stopped before reporting one."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos
          path: chaos.log

  # Opal's own resolver invariants over generated registries, 250,000 cases
  # each instead of proptest's default 256. A release build with overflow
  # checks and debug assertions kept on: about three times the cases per
  # minute of a debug build, still panicking where a debug build would.
  resolver-properties:
    name: Resolver properties (250,000 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROPTEST_CASES: "250000"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: V8's static library
        uses: ./.github/actions/rusty-v8
      - name: Run
        run: |
          set -o pipefail
          cargo test --release --all-features -p opal-pm --test resolution-properties 2>&1 | tee properties.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Resolver properties, ${PROPTEST_CASES} cases each"
            echo
            grep -E '^test result' properties.log || echo "No result: the suite stopped before reporting one."
          } >> "$GITHUB_STEP_SUMMARY"
      # A failing case is written to the regressions file. It becomes a named
      # regression test, so keep it rather than lose it with the runner.
      - name: Upload the failing case
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolution-properties-regressions
          path: |
            crates/opal-pm/tests/resolution-properties.proptest-regressions
            properties.log

  # The scaling curve's history (`benchmarks/BENCHMARKS.md`, "Scaling"): a
  # thousand packages side by side, and 10,000 edges onto 1,200 packages, with
  # each scenario's peak memory. On unchanged master these are also the
  # same-code samples the benchmark's noise floor needs. Tracked, never gated.
  bench:
    name: Install benchmark (scaling, tracked)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: rustup show
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: V8's static library
        uses: ./.github/actions/rusty-v8
      - name: Run
        run: |
          set -euo pipefail
          mkdir -p bench
          for workload in wide-1000 dedup-heavy; do
            cargo bench -p opal-pm --bench install-pipeline -- --json --workload "$workload" \
              --rtt-ms 25 --iterations 3 > "bench/${workload}.json"
          done
      - name: Summarize
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import json

          print("### Install benchmark, scaling (tracked, not gated)\n")
          print("| Workload | Scenario | Placements | Median | Min | Max | Peak RSS |")
          print("|---|---|---|---|---|---|---|")
          for path in sorted(glob.glob("bench/*.json")):
              record = json.load(open(path))
              for scenario in record["scenarios"]:
                  wall, peak = scenario["wall_ms"], scenario["peak_rss_bytes"]
                  print(
                      f"| {record['workload']['name']} | {scenario['scenario']} | {scenario['packages']} "
                      f"| {wall['median']:.1f} ms | {wall['min']:.1f} ms | {wall['max']:.1f} ms "
                      f"| {f'{peak / 2**20:.0f} MiB' if peak else '-'} |"
                  )
          PY
      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-benchmark-scaling
          path: bench/*.json

  # The runtime's native calls against JavaScript that frees the memory they
  # are using, under AddressSanitizer, where a use-after-free is a report and
  # not a wrong answer at random. The scripts are opal-cli's
  # tests/memory-safety/, which the ordinary suite also runs. ASan intercepts
  # readv/writev and the rest, so a syscall into freed memory is caught too.
  # The nightly is pinned: -Zsanitizer is unstable, and a new nightly breaking
  # the build should be a commit that moves this date, not a red night.
  address-sanitizer:
    name: AddressSanitizer (runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned nightly
        run: rustup toolchain install "$NIGHTLY" --profile minimal
      # --target keeps the sanitizer off the build scripts, which run on the
      # host: one of them runs V8 to make the startup snapshot.
      - name: Build opal with AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: cargo "+$NIGHTLY" build -p opal-cli --target x86_64-unknown-linux-gnu --target-dir target-asan
      - name: Run the memory-safety scripts
        env:
          # V8 keeps its heap until exit; a leak report would be noise.
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: |
          set -euo pipefail
          opal="$PWD/target-asan/x86_64-unknown-linux-gnu/debug/opal"
          for script in crates/opal-cli/tests/memory-safety/*.js; do
            echo "== $script"
            work="$(mktemp -d)"
            (cd "$work" && "$opal" run "$GITHUB_WORKSPACE/$script")
          done
