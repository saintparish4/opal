[package]
name = "opal-bundler"
description = "The opal build command: bundles a module graph into one ES module that behaves like the unbundled program."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The differential oracle (src/oracle.rs) spawns `node`. Tests and the fuzz
# workspace turn it on; the opal binary never does.
oracle = ["dep:serde_json"]

[dependencies]
opal-core.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
opal-bundler = { path = ".", features = ["oracle"] }
serde_json.workspace = true
tempfile.workspace = true
